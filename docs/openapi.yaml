openapi: 3.1.0
info:
  title: RentCar API
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - sesion: []
paths:
  /vehiculos:
    get:
      operationId: listarVehiculos
      summary: Lista los vehículos de la flota
      security: []
      responses:
        "200":
          description: Catálogo de vehículos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaVehiculos"
        "500": { $ref: "#/components/responses/Error500" }
        "405": { $ref: "#/components/responses/Error405" }
  /sucursales:
    get:
      operationId: listarSucursales
      summary: Lista las sucursales
      responses:
        "200":
          description: Lista de sucursales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSucursales"
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
  /clientes:
    get:
      operationId: listarClientes
      summary: Lista los clientes
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaClientes"
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
  /usuarios:
    get:
      operationId: listarUsuarios
      summary: Lista los usuarios del sistema
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarios"
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
  /pagos:
    get:
      operationId: listarPagos
      summary: Lista los pagos
      responses:
        "200":
          description: Lista de pagos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaPagos"
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
  /reservas:
    get:
      operationId: listarReservas
      summary: Lista las reservas
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, example: pendiente }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Lista de reservas (puede ser una lista vacía)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaReservas" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
    post:
      operationId: crearReserva
      summary: Crea una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaNueva" }
      responses:
        "201":
          description: La reserva creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaReserva" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
  /reservas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: verReserva
      summary: Devuelve una reserva
      responses:
        "200":
          description: La reserva consultada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaReserva" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
    patch:
      operationId: cambiarEstadoReserva
      summary: Cambia el estado de una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: "#/components/schemas/EstadoReserva" }
      responses:
        "200":
          description: La reserva con su estado nuevo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
    put:
      operationId: modificarReserva
      summary: Modifica los datos de una reserva (no su estado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaActualizacion" }
      responses:
        "200":
          description: La reserva modificada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
    delete:
      operationId: borrarReserva
      summary: Borra una reserva
      responses:
        "200":
          description: Reserva eliminada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaEliminacion" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /login:
    post:
      operationId: iniciarSesion
      summary: Entrega un token a cambio de usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, clave]
              properties:
                usuario: { type: string }
                clave: { type: string }
      responses:
        "200":
          description: El token de la sesión
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RespuestaVehiculos:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Vehiculo" }
    RespuestaSucursales:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Sucursal" }
    RespuestaClientes:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Cliente" }
    RespuestaUsuarios:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Usuario" }
    RespuestaPagos:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Pago" }
    RespuestaReservas:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items: { $ref: "#/components/schemas/Reserva" }
    RespuestaReserva:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos: { $ref: "#/components/schemas/Reserva" }
    RespuestaEliminacion:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: object
          required: [mensaje]
          properties:
            mensaje: { type: string, const: "reserva eliminada" }
    EstadoReserva:
      type: string
      enum: [pendiente, confirmada, en_curso, finalizada, cancelada]
    Sucursal:
      type: object
      required: [ID, Nombre, Ciudad, Direccion, Activa]
      properties:
        ID: { type: integer, readOnly: true }
        Nombre: { type: string }
        Ciudad: { type: string }
        Direccion: { type: string }
        Activa: { type: boolean }
    Usuario:
      type: object
      required: [ID, SucursalID, Nombre, Correo, Rol]
      properties:
        ID: { type: integer, readOnly: true }
        SucursalID: { type: integer }
        Sucursal: { $ref: "#/components/schemas/Sucursal" }
        Nombre: { type: string }
        Correo: { type: string, format: email }
        Rol: { type: string, enum: [administrador, agente] }
    Cliente:
      type: object
      required: [ID, Nombre, Correo, Telefono, Cedula]
      properties:
        ID: { type: integer, readOnly: true }
        Nombre: { type: string }
        Correo: { type: string, format: email }
        Telefono: { type: string }
        Cedula: { type: string }
    Vehiculo:
      type: object
      required: [ID, SucursalID, Marca, Modelo, Tipo, PrecioDia, EstadoFlota]
      properties:
        ID: { type: integer, readOnly: true }
        SucursalID: { type: integer }
        Sucursal: { $ref: "#/components/schemas/Sucursal" }
        Marca: { type: string }
        Modelo: { type: string }
        Tipo: { type: string, enum: [auto, camioneta] }
        PrecioDia: { type: number }
        EstadoFlota: { type: string, enum: [disponible, alquilado, mantenimiento] }
        Reservas:
          type: array
          items: { $ref: "#/components/schemas/Reserva" }
    Pago:
      type: object
      required: [ID, ReservaID, Monto, Metodo, EstadoPago, Referencia, Creado]
      properties:
        ID: { type: integer, readOnly: true }
        ReservaID: { type: integer }
        Monto: { type: number }
        Metodo: { type: string, enum: [transferencia, efectivo] }
        EstadoPago: { type: string, enum: [por_verificar, verificado, rechazado] }
        Referencia: { type: string }
        Creado: { type: string, format: date-time }
    Reserva:
      type: object
      required: [ID, ClienteID, VehiculoID, FechaInicio, FechaFin, Total, Estado]
      properties:
        ID: { type: integer, readOnly: true }
        ClienteID: { type: integer, example: 1 }
        Cliente: { $ref: "#/components/schemas/Cliente" }
        VehiculoID: { type: integer, example: 1 }
        Vehiculo: { $ref: "#/components/schemas/Vehiculo" }
        FechaInicio: { type: string, example: "2026-11-01" }
        FechaFin: { type: string, example: "2026-11-04" }
        Total: { type: number, example: 105.0 }
        Estado: { $ref: "#/components/schemas/EstadoReserva" }
        Pagos:
          type: array
          items: { $ref: "#/components/schemas/Pago" }
    ReservaNueva:
      type: object
      description: El estado inicial se asigna siempre como pendiente. Se acepta PascalCase o snake_case.
      required: [ClienteID, VehiculoID, FechaInicio, FechaFin, Total]
      properties:
        ClienteID: { type: integer, minimum: 1, example: 1 }
        VehiculoID: { type: integer, minimum: 1, example: 1 }
        FechaInicio: { type: string, format: date, example: "2026-11-01" }
        FechaFin: { type: string, format: date, example: "2026-11-04" }
        Total: { type: number, exclusiveMinimum: 0, example: 105.0 }
    ReservaActualizacion:
      type: object
      description: VehiculoID y Estado no se modifican mediante PUT. Se acepta PascalCase o snake_case.
      required: [ClienteID, FechaInicio, FechaFin, Total]
      properties:
        ClienteID: { type: integer, minimum: 1, example: 1 }
        FechaInicio: { type: string, format: date, example: "2026-11-01" }
        FechaFin: { type: string, format: date, example: "2026-11-04" }
        Total: { type: number, exclusiveMinimum: 0, example: 105.0 }
    Error:
      oneOf:
        - $ref: "#/components/schemas/ErrorEnvoltura"
        - $ref: "#/components/schemas/ErrorSimple"
    ErrorEnvoltura:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string }
            mensaje: { type: string }
    ErrorSimple:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    Error400:
      description: El servidor no entendió la petición
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error401:
      description: No se sabe quién hace la petición
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error403:
      description: Se sabe quién es, pero su rol no puede hacer esto
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error404:
      description: No existe el elemento
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error500:
      description: El servidor no pudo completar la operación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error405:
      description: El método HTTP no está permitido en esta ruta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error422:
      description: Se entendió, pero un dato rompe una regla del negocio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
