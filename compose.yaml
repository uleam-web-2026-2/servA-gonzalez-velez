services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-rentcar}
    volumes:
      - rentcar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: .
    environment:
      DATABASE_URL: "host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env} dbname=${POSTGRES_DB:-rentcar} port=5432 sslmode=disable"
      PUERTO: ${PUERTO:-8080}
      TIEMPO_ESPERA_SEGUNDOS: ${TIEMPO_ESPERA_SEGUNDOS:-5}
      CLAVE_FIRMA: ${CLAVE_FIRMA:?Define CLAVE_FIRMA en .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  rentcar-postgres-data:
